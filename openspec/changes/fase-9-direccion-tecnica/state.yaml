phases:
  proposal:
    status: done
    artifact: openspec/changes/fase-9-direccion-tecnica/proposal.md
    note: >
      Cubre el bloque entero (fases 9 a 13) por decisión del propietario. El
      hallazgo que ordena el reparto es que un club no existe entre temporadas
      (teams cuelga de season_id y la spec de league-data-model lo prohíbe
      explícitamente), mientras que trofeos, asignación de técnico, historial de
      fichajes y ficha pública lo dan por hecho. De ahí que la entidad Club sea
      la fase 9 y no un detalle posterior. 11 decisiones cerradas con el
      propietario y CERO preguntas abiertas: las tres que había se cerraron el
      mismo día — acceso por correo también para los técnicos (sin username),
      nombre visible del técnico = el de su cuenta, y plantillas/estadios
      suben a la Fase 9 para dejar de colgar del equipo-temporada.
  design:
    status: done
    artifact: openspec/changes/fase-9-direccion-tecnica/design.md
    note: >
      15 decisiones. Las de más peso: D1 (Team conserva accesores que delegan en
      Club, para no tocar las decenas de puntos que leen $team->name), D4 (dos
      paneles Filament en vez de uno con el menú recortado, porque esconder un
      recurso deja la ruta viva), D7 y D8 (el saldo se deriva de un libro de
      movimientos y un traspaso entre clubes es UNA fila leída desde los dos
      lados, no dos), D9 (las salidas no borran al jugador: la FK de game_events
      es cascadeOnDelete y borrarlo reescribiría los goleadores históricos) y
      D10 (aceptar una oferta no ejecuta nada, para que exista una única puerta
      de entrada al dinero y a las plantillas). D1b se añadió después de que el
      propietario decidiera que el jugador no puede ser por temporada: players
      y stadiums pasan al club en la misma migración, y se deja dicho en claro
      lo que se pierde a cambio — la aplicación deja de saber quién estuvo en
      una plantilla pasada, historia que la Fase 12 recupera por el lado de los
      traspasos.
  apply:
    status: done
    note: >
      Fase 9 aplicada en la rama fase-9/1-club-y-rol-tecnico, en tres commits
      (club, plantillas, rol y acceso). Suite de 254 a 299 en verde, Pint
      limpio, y las TRES migraciones ensayadas ida y vuelta contra una copia
      restaurada de producción antes de acercarse a la real. Dos hallazgos que
      obligaron a resolver algo no obvio y quedan comentados en el código: los
      factories construyen los modelos dentro de Model::unguarded(), así que
      #[Fillable] no filtra los atributos que dejaron de ser columnas y hay que
      retirarlos a mano; y el atributo de título de un ->relationship() de
      Filament tiene que ser una columna real de la tabla consultada, porque
      hace pluck y filtra por ella, de ahí TeamOptions. Incidente registrado: se
      corrió migrate:fresh sobre la base de DESARROLLO y se perdió lo que el
      propietario tenía en local (producción intacta); se repobló con el seed.

      Fase 10 aplicada en la rama fase-10/1-plantilla-trofeos, en tres commits
      (plantilla, trofeos y enfrentamientos; once ideal; y el cierre con lo que
      faltaba). Suite de 299 a 340. Tres migraciones, todas aditivas, así que
      esta fase no tiene el riesgo de la 9 y no hizo falta ensayo contra una
      copia de producción. Dos hallazgos anotados en el código: Livewire
      reserva $slots en un componente y una propiedad pública con ese nombre
      revienta el render con "Call to a member function getName() on int" (de
      ahí $picks); y un SelectFilter ->relationship('matchday', 'number')
      ofrece una fila por jornada de CADA división y temporada, varias "1"
      indistinguibles, así que la jornada se filtra por número. NOTA: ni la
      Fase 9 ni la 10 están subidas todavía — el propietario decidió el
      2026-09-21 construir primero y subir después.
  tasks:
    status: done
    artifact: openspec/changes/fase-9-direccion-tecnica/tasks.md
    note: >
      Fases 9 y 10 detalladas, una debajo de la otra en el mismo artefacto; las
      11 a 13 siguen como esqueleto al final.
      De la 9, la unidad 1 lleva dos restricciones aprendidas en el cambio
      anterior: el
      índice único nuevo entra antes de soltar el viejo (errno 1553 en MySQL,
      donde el viejo sostiene la FK de season_id), y la migración se prueba
      contra un TiDB desechable antes de acercarse a producción.

decisions_locked:
  - "PANEL MIXTO: plantilla, trofeos, enfrentamientos y contabilidad en un panel Filament propio (/club); once ideal y chat como pantallas Livewire dentro de ese panel."
  - "PRESUPUESTO: el técnico propone el movimiento con su razón y el admin lo aprueba; lo propuesto no cuenta en el saldo."
  - "DINERO AUTOMÁTICO: un traspaso entre clubes de la liga genera el egreso del comprador y el ingreso del vendedor, ya aprobados, y mueve al jugador. Los préstamos no generan movimientos porque no tienen coste."
  - "OFERTAS: aceptar marca la oferta como acordada y avisa al admin, que ejecuta el traspaso. No toca plantillas ni presupuestos por sí sola."
  - "IDENTIDAD DE CLUB: se crea la entidad Club y teams pasa a ser su participación en una temporada. Descartado el slug compartido por integridad floja."
  - "SALIDAS DE LA LIGA: el jugador se marca como salido y su fila se conserva. Borrarlo arrastraría sus game_events en cascada y reescribiría los goleadores históricos."
  - "PRÉSTAMOS: el plazo (6 meses o 1 año) se anota como dato; no vencen solos, porque no hay tareas programadas en este despliegue."
  - "UN TÉCNICO POR CLUB, UN CLUB POR TÉCNICO."
  - "ACCESO POR CORREO también para los técnicos: el admin les asigna uno al crear la cuenta. Descartado users.username por decisión del propietario ('se les asignara correo para evitar mas trabajo') — habría obligado a tocar la autenticación de Filament en los dos paneles sin ganar nada funcional."
  - "EL NOMBRE VISIBLE DEL TÉCNICO en la ficha pública es el name de su cuenta."
  - "EL JUGADOR SE PARTE EN IDENTIDAD Y PERTENENCIA (Fase 9): players cuelga del club propietario, y squad_memberships guarda team_id, player_id, dorsal y tipo (propiedad o cesión) por temporada. El unique(team_id, shirt_number) que hoy vive en players es exactamente el que necesita la tabla nueva. Los estadios pasan al club."
  - "NO se pierde la historia de plantillas: era la preocupación del propietario y por eso se descartó tanto reconstruirla desde los traspasos (sólo cuadra si todo movimiento se registró, y una corrección a mano la rompe en silencio) como la foto congelada al cerrar temporada (depende de que alguien la ejecute y no cubre lo que pasa entre fotos)."
  - "INSCRIBIR UN CLUB EN UNA TEMPORADA ARRASTRA SU PLANTILLA anterior, automáticamente, mediante un observador de Team::created que queda mudo bajo WithoutModelEvents."
  - "IDIOMA: /club en español, /admin se queda en inglés. Se resuelve con ->label() por recurso, sin tocar el locale de la aplicación."
  - "VALOR DE JUGADOR ÚNICO, no por temporada. El total de la plantilla se calcula con los valores vigentes."
  - "SIN fotos de jugadores, SIN notificaciones por correo, SIN websockets (chat por sondeo), SIN tareas programadas, SIN traducir /admin."
  - "ESTE BLOQUE CIERRA EL PENDIENTE 4.1 DE DESPLIEGUE.md, cuyo disparador anotado era exactamente la llegada del rol técnico."
