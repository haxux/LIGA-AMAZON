  apply:
    status: done
    artifact: openspec/changes/fase-6-pulido/apply-progress.md
    note: >
      All 20 tasks done in one apply session on branch fase-6/1-pulido
      (created off fase-5/9-public-scorers-news, commit 5991aeb). Phase 1's
      MatchdayFactory fix got a genuine RED/GREEN/TRIANGULATE TDD cycle (4
      new tests in tests/Feature/MatchdayFactoryTest.php); found and fixed a
      real off-by-one bug in design D6's own Sequence-closure code sample
      during GREEN (Sequence::__invoke() increments $sequence->index before
      the lazily-evaluated inner closure runs, so reading it there saw the
      post-increment value — fixed by capturing the offset in the outer
      closure instead). GamesRelationManagerTest re-run 3x, no flake. Phases
      2-8 (CSS utilities, 2 new leaf components, layout shell, 4 component
      restyles, 5 page headings, Storage::disk('public') fix, full-suite
      checkpoint) implemented directly with regression checks after each
      surface per design's Testing Strategy. Full suite: 169/169 (165 + 4
      new), matching the corrected target exactly. Found and fixed a second,
      wider defect during the Phase 6.6 text-ink audit: several card-internal
      text nodes (team names, stat columns, player names, news titles) had no
      explicit text color and were relying on inheriting text-white from the
      old body — once body flipped to text-ink (D1), those would have
      rendered as invisible dark-on-dark text inside the still-dark
      bg-surface/bg-surface-alt cards. Fixed in standings-table, game-card,
      scorer-list, news-card. Manual visual review (8.2) done by curling the
      4 live rendered pages against seeded Fase-2 demo data and reading
      actual HTML output/class attributes, not asserted without basis.
      npm run build (via the node docker service) confirmed the new
      @utility CSS compiles. Actual diff: 256 insertions + 67 deletions = 323
      changed lines across 15 source files, under the 400-line budget
      (forecast was Medium 380-460) — no split needed, single PR as planned.
      Left unmerged on fase-6/1-pulido for user review, matching the Fase
      2-5 pattern. Next: sdd-verify.
