decisions_locked:
  - "SCOPE: pure visual restyle of the 4 existing public pages (resources/views/site/**, components/{layouts/site,site}/**) + resources/css/app.css, applying openspec/design-reference/amazon-superleague/NOTES.md's visual language (already-wired tokens) as markup/classes only. Plus one deferred bug fix: database/factories/MatchdayFactory.php's non-unique 'number' field, which intermittently collides in GamesRelationManagerTest (Fase-3-era flaky test, deferred 3 phases)"
  - "NOT included (user-declined, real feature work not pure polish): 'forma reciente' (recentForm() service method, W/D/L chips) and 'partido destacado de la semana' (highlighted/next-game widget). Both remain documented future-extension options, not built in Fase 6"
  - "Structural scope: does NOT re-open the merged public-views spec's 4-route structure (standings/, partidos/, goleadores/, noticias/). Applies the mockup's single-page-dashboard visual LANGUAGE to each existing route in place, not a page-structure rewrite. No featured-news hero card (would need a new News schema flag — schema work, out of scope). No Fantasy Superleague section. No live-badge/status concept (Game has no status field, correctly not reopened)"
  - "Admin panel: OUT OF SCOPE entirely. Filament uses its own compiled stylesheet, never consumes app.css (confirmed Fase 5 design.md D10, no ->viteTheme() registered)"
  - "Standings columns: KEEP the current fuller column set (#, Equipo, PJ, G, E, P, GF, GC, DG, PTS) — do NOT reduce to the mockup's condensed POS/EQUIPO/PJ/DG/PTS set. Apply mockup's row/color/spacing styling on top of the existing informative column set (locked without a separate question — obvious right call, don't remove information users already have, don't break existing content assertions)"
  - "Promotion/relegation legend: STATIC visual legend/color-key only (e.g. a small dot+label row explaining what colors would mean) — NO row coloring, no top-N/bottom-N threshold logic invented. User explicit: 'dejalo así por el momento, luego yo haré indicaciones, pero en un futuro tendrán color' — zone-coloring rules are a future decision the user will specify later, not decided now. No spec change needed for this (purely presentational, no promotion/relegation business rule exists or is being added)"
  - "Team crests: use the REAL uploaded crest_path image (via the public disk, already wired since Fase 2) with a generic-shape fallback when null — NOT always-generic. User confirmed teams will have real crest images"
  - "Player avatars: STAY GENERIC PLACEHOLDER for now — user explicitly said players will eventually get avatar images too, but sourced from an EXTERNAL API (not a file-upload field like crest_path), and that work is NOT happening in this phase ('lo de los jugadores aún no lo haremos'). IMPORTANT for design: build the avatar-placeholder markup/component in a way that doesn't foreclose later swapping in an external-API-sourced avatar URL (e.g. a simple conditional img-src slot in the scorer-list/avatar component, not hardcoded-forever static SVG with no swap point) — this is a Future-Proofing note, not a task to build the API integration now"
  - "Testing: existing HTTP tests (StandingsPageTest, FixturesPageTest, ScorersPageTest, NewsPageTest) assert content/status only, not markup/CSS — they serve as regression guards through this restyle, not blockers. No pixel-diff/snapshot tooling introduced (no precedent in this stack, disproportionate for demo scope). Manual visual review against the mockup is the actual fidelity-verification method. Full suite (165 + new MatchdayFactory regression test) must stay green throughout. The MatchdayFactory fix DOES get a genuine TDD RED/GREEN cycle (it's a real bug fix, not styling)"
  - "Fase 5's two undocumented review-workload-budget overruns (units 2 and 4) are NOT actionable code changes in this phase — those branches are already merged/archived, nothing to retroactively re-split. Treated as a process lesson for this phase's own sdd-tasks to forecast more conservatively, not a code task"
  - "DESIGN D1 — Gradient as Tailwind v4 @utility in app.css (bg-brand-weave for the body's yellow diagonal weave, bg-hatch for empty image slots), NOT inline style and NOT @layer base. @theme block stays untouched. Exact values lifted from openspec/design-reference/amazon-superleague/Amazon Superleague.dc.html line 28 / line 57 (NOTES.md only describes them in prose). CONSEQUENCE that must not be missed: body goes from bg-ink/text-white to bg-brand-weave/text-ink, so the 5 page h1/h2 headings currently inheriting white MUST become text-ink; text inside dark cards stays white"
  - "DESIGN D2 — Wordmark is pure typography, no logo image (none exists in the repo, none created). Two spans: AMAZON font-extrabold text-brand + SUPERLEAGUE font-semibold text-white tracking-[0.14em], font-display text-[27px]. Verified safe: grep of tests/ found NO assertion on 'Liga Amazon' or any nav label. uploads/pasted-1785857503738-0.png is a low-fidelity wireframe render — reference material only, NOT a usable asset; no image asset ships in this change"
  - "DESIGN D3 — Active nav indicator via request()->routeIs() in a @php $nav array loop inside the layout; news matches 'site.news.*' so /noticias/{slug} also highlights. Rejected passing an $active prop from each of the 5 views (5 call sites to keep in sync, zero benefit). Active = border-b-[3px] border-brand text-white; inactive = border-transparent text-white/72"
  - "DESIGN D4 — NEW component resources/views/components/site/team-crest.blade.php (props: team, size), used 3x (standings row, game-card home, game-card away). Reads via Storage::disk('public')->url($team->crest_path) EXPLICITLY — mirroring TeamForm's ->disk('public')->directory('crests'). Deliberately NOT the bare Storage::url() the news views use: config/filesystems.php:16 defaults to the 'local' disk and only resolves to the same URL by coincidence of the public/storage symlink. Fallback is a neutral rounded-[3px] bg-surface-muted span with NO text (no initials) — adds zero new strings to rendered HTML, so zero new assertSee/assertDontSee surface. alt=\"\" (decorative; team name always adjacent). No new query / no N+1: crest_path rides on Team models already eager-loaded"
  - "DESIGN D5 — Player-avatar swap seam: NEW component resources/views/components/site/player-avatar.blade.php accepting a :player prop it does not yet use, rendering only the circular bg-surface-muted placeholder, with a comment naming the exact future edit. REJECTED $player->avatar_url ?? null — on an Eloquent model a missing attribute silently returns null, making it permanent dead code that LIES about the schema (a reviewer cannot tell whether the column exists). One unused prop is the honest, minimal seam"
  - "DESIGN D6 — MatchdayFactory fix needs BOTH halves, either alone leaves a real hole: (a) a 'number' closure calling a private static nextNumberForSeason() that does Matchday::where('season_id', ...)->max('number') + 1 — fixes separate ->create() calls (the actual GamesRelationManagerTest bug), which a Sequence alone does NOT because each new factory instance restarts at index 0; (b) a configure() Sequence adding $sequence->index as an offset — fixes ->count(N)->create(), which the DB max alone does NOT because Factory::make() builds all N instances before store() persists any. REJECTED fake()->unique()->numberBetween(1,18): Laravel's fake() is a process-wide singleton whose unique-store is NOT reset by RefreshDatabase (OverflowException after 18 matchdays suite-wide) and it enforces GLOBAL uniqueness where the constraint is per-season. Safe for all callers: season_id is key 0 in definition() and expandAttributes() writes each resolved value back before evaluating the next key, so the closure sees a resolved id for bare factory(), ->for($season) and create(['season_id'=>...]) alike; the 8 call sites passing 'number' explicitly override the state so the closure never runs (DatabaseSeeder adds ZERO extra queries)"
  - "DESIGN D7 — Standings keeps stacked <section> per division; the mockup's Primera/Segunda tab switcher is client state with no server equivalent and is NOT built — resources/js/app.js stays untouched. Legend is two static dot+label spans (bg-brand 'CLASSIFICACIÓN', bg-loss 'DESCENSO') under the table. No row coloring, no thresholds"
  - "DESIGN — TWO CONCRETE TEST-COLLISION HAZARDS found by reading the existing tests, both HARD constraints for apply: (1) StandingsPageTest::test_empty_division_renders_no_table does assertDontSee('Segunda'), and the mockup footer links 'Primera División'/'Segunda División' — the expanded footer MUST NOT contain division names; use neutral columns pointing at real routes only (no dead # links, no login/language block). (2) FixturesPageTest::test_page_groups_games_by_matchday does assertSeeInOrder(['1','2']), which passes only because initial-scale=1 in <head> precedes any '2' — do NOT add a season label like '2026/27' to the header. Everything else verified clean: all four page tests assert status codes and content strings only, zero CSS/DOM/snapshot assertions, so NO existing test file is modified"
  - "DESIGN — MatchdayFactory gets 4 deterministic RED/GREEN tests in a new tests/Feature/MatchdayFactoryTest.php, not 1: (a) 20 sequential create() calls for one season assert distinct number count = 20 — RED is GUARANTEED by pigeonhole (20 draws from numberBetween(1,18) must repeat), not probabilistic, so no faker seeding needed; (b) ->count(20)->create() batch, same pigeonhole, guards the D6 batch half; (c) numbers restart per season (guards against a global-counter regression); (d) an explicitly passed number is respected (guards the 8 existing callers). Proposal's success criterion '165 + 1' should read 165 + 4 = 169"
  - "DESIGN — Work-unit recommendation for sdd-tasks: ONE unit / one branch (fase-6/1-pulido). 15 files, ~12 of them <=40 changed lines, and all surfaces share D1's colour inversion so splitting by page creates half-restyled unreviewable intermediate states. Forecast 400-line budget risk: MEDIUM (est. 380-460 changed lines, dominated by standings-table and site.blade.php). If the forecast lands >400, the ONLY clean split is unit 1 = MatchdayFactory fix + tests (~70 lines, independently valuable and revertible), unit 2 = restyle — split on that seam, never between pages"
  - "DESIGN — Future-proofing confirmed for all 5 deferred items: recentForm() chips append as one <th>/<td> pair (win/draw/loss tokens already exist unused), partido-destacado is a new prop or sibling of the self-contained game-card, player avatars are D5's one-file edit, zone coloring only needs a threshold source since the legend markup already names both zones, and the news hero stays additive once a News flag exists. Nothing in this phase forecloses any of them"

