    test_suite: "78/78 passing (31 Fase-2 baseline + 47 new), 211 assertions, zero regressions"
    design_correction_found: >
      D3/D2's Get type hint resolves to Filament\Schemas\Components\Utilities\Get
      in the installed 5.7.6 tree, not Filament\Forms\Get as the design.md snippet
      implies. Confirmed live via a TypeError on the injected closure parameter.
      Applied consistently across Phases 1-4.
    design_gap_found_phase3: >
      PlayerForm's team-scoped unique() rule silently stopped enforcing scoping
      inside PlayersRelationManager because $get('team_id') resolves to null
      when team_id isn't part of the RM's form schema (removed by design, set
      via the relationship instead). Fixed by injecting $livewire into the
      modifyRuleUsing closure and falling back to
      $livewire->getOwnerRecord()->getKey() when $get('team_id') is blank and
      $livewire instanceof RelationManager. Confirmed in Phase 4 that this
      specific failure mode does NOT recur for GameForm's D2 guard, since
      home_team_id (the field the guard reads) stays in-schema inside
      GamesRelationManager — only matchday_id is removed there.
    d2_guard_live_confirmation: >
      Phase 4 reproduced design.md's V6 finding with a real failing assertion
      before the fix: the Game model's ValidationException IS caught by
      Livewire (errors bag non-empty) but lands under the unprefixed
      away_team_id key, invisible to the field wrapper checking
      data.away_team_id. The closure rule() on away_team_id (D2) is confirmed
      as the correct and necessary fix, not a defensive/optional addition.
