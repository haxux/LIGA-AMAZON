      Live-verified against installed filament/filament 5.7.6 vendor source
      (not docs/blog posts): separate Schemas/+Tables/ file layout confirmed,
      resource lives under a plural-model subdirectory, relation managers are
      plural (PlayersRelationManager, GamesRelationManager — corrects the
      proposal's singular naming). Game's home/away-team guard does NOT
      surface to the user by default (Livewire swallows the ValidationException
