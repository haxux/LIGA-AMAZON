decisions_locked:
  - "Stadium: RelationManager-only under TeamResource, no standalone StadiumResource/nav item"
  - "Player: standalone PlayerResource (league-wide search/filter by position) AND PlayersRelationManager on TeamResource (squad-building)"
  - "Season: standalone SeasonResource in scope (unnamed in roadmap, but no other UI path to create a second season)"
  - "canAccessPanel() role restriction stays deferred beyond Fase 3 — no spatie/permission, no filament-shield, any authenticated user reaches /admin"
  - "Game: standalone GameResource (cross-matchday lookup/correction) AND GamesRelationManager on MatchdayResource (entering a round's 5 results)"
  - "Filament 5.7.6 file layout: app/Filament/Resources/{PluralModel}/{Model}Resource.php + Schemas/{Model}Form.php (singular) + Tables/{PluralModel}Table.php (plural) + Pages/"
  - "Game guard surfaced via closure rule() on away_team_id form field (not different(), not a form-level custom validator elsewhere) — travels correctly into GamesRelationManager's embedded form"
  - "Deletion: no pre-check guard before restrictOnDelete FKs (spec-honored, DB still rejects) — one post-DB try/catch -> Notification::danger() on TeamResource only, per design D4"
  - "Demo scope assumptions from proposal's unanswerable question round: single trusted operator, field-level validation only (no structural/league-integrity enforcement), hard deletes with existing cascade/restrict behavior, no bulk import/audit/soft-delete — consistent with ARQUITECTURA.md's stated demo-functional scope, not re-confirmed with user as redundant"

