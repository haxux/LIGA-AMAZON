      cast, since Laravel's built-in different() rule uses strict === and
      passes on int-vs-string mismatches. D3 adds mirrored form unique() rules
      for 4 pre-existing DB composite uniques (not in spec, flagged as optional
      cut — kept: surfaces existing Fase 2 DB constraints cleanly, no new
      invariant introduced, consistent with "field-level validity only" scope).
