decisions_locked:
  - "Game.home_score/away_score nullable = not played, no status enum"
  - "Team.crest_path = real uploaded image file; storage groundwork in this change, Filament UI itself is Fase 3"
  - "Storage serving: storage:link attempt, nginx alias (docker/nginx/default.conf) committed as fallback; apply records which mechanism actually serves"
  - "FK strategy: cascadeOnDelete for single-owner chains, restrictOnDelete on Game.home_team_id/away_team_id"
  - "PHPUnit only for strict_tdd tests (Pest not installed)"
  - "home_team_id <> away_team_id enforced via Game::booted() Eloquent guard (ValidationException), not raw SQL CHECK"
  - "No is_current/active-season flag on Season (explicitly declined by user)"
  - "Seed: 1 season, 10 teams (Fase-5 mockup division A names), 180 players, 18 matchdays, 90 games, MD 1-10 scored / 11-18 null, crest_path null in seed data"
  - "DatabaseSeeder uses WithoutModelEvents (pre-existing) — seeder guarantees distinct teams by construction (circle-method round-robin), does not rely on the Game guard"

out_of_scope_this_change:
  - "Division/sub-league support within a Season — deferred, additive-migration-friendly per Future-Proofing Check"
  - "News/Article entity — deferred, unrelated to this schema"
  - "Player match-level event stats (goals/assists/cards) — deferred, additive table when built"
  - "Filament Resources (admin CRUD for these models) — Fase 3"
  - "StandingsService (computing the table) — Fase 4"
  - "Public Blade views — Fase 5"

