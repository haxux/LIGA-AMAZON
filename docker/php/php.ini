; Liga Amazon — local dev overrides for php-fpm

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
max_input_time = 120

; Opcache — dev settings. validate_timestamps stays on so edits are picked up
; without a restart, but revalidate_freq=0 forces a filesystem stat() on every
; included file (Filament alone is thousands of files) on every single
; request — on Windows/Docker Desktop's bind-mounted volume that stat() storm
; is the dominant cost per request. revalidate_freq=2 caps re-validation to
; once every 2s of wall-clock time: edits still show up within ~2s, but
; back-to-back requests within that window skip the stat() storm entirely.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; PHP's realpath cache is also thrashed by the same stat()-heavy vendor tree;
; widen it so repeated path lookups (autoloader, view resolution) hit cache
; instead of re-resolving through the slow bind-mounted filesystem.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Errors — visible in dev, never blank-page silently
display_errors = On
log_errors = On
error_reporting = E_ALL

date.timezone = UTC
