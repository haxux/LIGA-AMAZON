; Liga Amazon — local dev overrides for php-fpm

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
max_input_time = 120

; Opcache — dev settings (revalidate every request so edits are picked up live)
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Errors — visible in dev, never blank-page silently
display_errors = On
log_errors = On
error_reporting = E_ALL

date.timezone = UTC
